autoware_tracker:
    cluster:
        iskitti: false
        label_source: "/image_detections"
        extrinsic_calibration: "$(find autoware_tracker)/config/sensor_fusion.txt"
        iou_threshold: 0.35

        points_node: "/points_raw"
        output_frame: "velodyne"

        remove_ground: false
        downsample_cloud: true
        leaf_size: 0.1

        use_multiple_thres: false

        cluster_size_min: 3
        cluster_size_max: 10000
        clip_min_height: -5.0
        clip_max_height: 5.0
        cluster_merge_threshold: 1.2
        clustering_distance: 1.5
        remove_points_min: 0.8
        remove_points_max: 80.0

        keep_lanes: false
        keep_lane_left_distance: 5.0
        keep_lane_right_distance: 5.0

        use_diffnormals: false
        pose_estimation: true

        use_callback: true
        use_camera: false
        no_camera_label: "9"

    tracker:
        gating_thres: 9.22
        gate_probability: 0.99
        detection_probability: 0.9
        life_time_thres: 8
        static_velocity_thres: 0.5
        static_num_history_thres: 3
        prevent_explosion_thres: 1000
        merge_distance_threshold: 0.5
        use_sukf: false

        tracking_frame: "velodyne"
        track_probability: 0.7
